<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח זמנים משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>לוח זמנים משפחתי</h1>
    <div class="controls">
      <div id="people" class="people" role="group" aria-label="סינון לפי אדם"></div>
      <label class="only-conflicts">
        <input type="checkbox" id="focus-conflicts">
        <span>הדגש חפיפות</span>
      </label>
      <span id="conflict-summary" class="summary"></span>
      <button type="button" id="reset-off" class="reset" hidden></button>
    </div>
  </header>

  <section id="unlock" class="unlock" hidden>
    <h2>הלוח מוצפן</h2>
    <p>הדביקו את מפתח המשפחה כדי לפתוח אותו. המפתח יישמר בדפדפן הזה, כך שבפעם הבאה הלוח ייפתח מיד.</p>
    <form id="unlock-form">
      <input id="key-input" type="text" dir="ltr" inputmode="text" spellcheck="false"
             autocomplete="off" autocapitalize="off" placeholder="מפתח (44 תווים)" required>
      <button type="submit">פתח</button>
    </form>
    <p id="unlock-error" class="unlock-error" hidden></p>
  </section>

  <main id="days" class="days" aria-live="polite"></main>

  <div id="error" class="error" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
